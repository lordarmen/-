<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Полупрозрачные блоки</title>
    <style>
        body {
            background-image: linear-gradient(45deg, #ddd 25%, transparent 25%),
                              linear-gradient(-45deg, #ddd 25%, transparent 25%);
            background-size: 20px 20px;
            padding: 20px;
        }
        
        .transparent-box {
            background-color: rgba(76, 175, 80, 0.5);
            padding: 20px;
            margin: 20px 0;
            border-radius: 10px;
        }
        
        .transparent-blue {
            background-color: rgba(33, 150, 243, 0.4);
            padding: 20px;
            margin: 20px 0;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <h2>Пример 3: Полупрозрачные блоки</h2>
    
    <div class="transparent-box">
        <h3>Полупрозрачный зелёный блок</h3>
        <p>Этот блок имеет полупрозрачный фон (50% прозрачности).</p>
    </div>
    
    <div class="transparent-blue">
        <h3>Полупрозрачный синий блок</h3>
        <p>Этот блок имеет полупрозрачный фон (40% прозрачности).</p>
    </div>
</body>
</html>
