<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="utf-8">
        <title>крутое название</title>
        <style>
            div{
                font-size: 20px;
                background-color: rgb(206, 237, 247);
                margin: 100px 150px 100px 80px;
                border: 1px solid black;
                width: 710px;
            }
        </style>
    </head>
    <body>
        <h1>Использование отступов</h1>
        <div>
            Данный компонент имеет отступ сверху 100px, отступ справа 150px, отступ снизу 100px, отступ слева 80px, 
            <span style="color: crimson;">а ещё я вот так умею,</span>
            <span style="color: darkgreen; border: 2px solid rgb(0, 94, 20);">и так, </span>
            <span style="color: darkorchid; text-decoration-line: line-through;">и даже так, </span>
            <marquee scrollamount="25" behavior="alternate">
                <span style="color: chocolate; font-size: 40px">и купи картошку пж</span>
            </marquee>
        </div>
    </body>
</html>
