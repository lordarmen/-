<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>тупое название</title>
        <style>
            .aboba{
                font-family: 'Times New Roman', Times, serif;
                font-size: 100px;
                font-weight: bold;
                color: white;
                margin: 50px 50px 0px 50px;
                padding: 30px 30px 30px 30px;
                background-color: rgb(68, 175, 211);
                width: auto;
            }
            .flash{
                font-family: 'Times New Roman', Times, serif;
                font-size: 30px;
                margin: 0px 50px 50px 50px;
                padding: 30px 30px 30px 30px;
                background-color: rgb(202, 221, 228);
                width: auto;
            }
        </style>
    </head>
    <body>
        <div class="aboba">
            Вот такой колобок
        </div>
        <div class="flash">
            История о том, как колобок встретил лису и съел её. Та очень долго и мучительно переваривалась в его желудке.
        </div>
    </body>
</html>
