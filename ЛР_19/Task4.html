<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Внутренние отступы слева</title>
    <style>
        body {
            padding: 20px;
        }
        
        .padding-2cm {
            background-color: rgba(76, 175, 80, 0.3);
            padding-left: 2cm;
            border: 1px solid #4caf50;
            margin: 20px 0;
        }
        
        .padding-50percent {
            background-color: rgba(33, 150, 243, 0.3);
            padding-left: 50%;
            border: 1px solid #2196f3;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <h2>Пример 4: Текст с left-padding</h2>
    
    <div class="padding-2cm">
        <p>В данном блоке поле слева равно 2см. Внутренний отступ слева составляет 2 сантиметра.</p>
    </div>
    
    <div class="padding-50percent">
        <p>В данном блоке поле слева 50%. Внутренний отступ слева составляет 50% от ширины родительского элемента.</p>
    </div>
</body>
</html>
