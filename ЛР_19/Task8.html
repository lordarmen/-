<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Стили границ</title>
    <style>
        body {
            padding: 20px;
            font-family: Arial, sans-serif;
        }
        
        .border-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin: 20px 0;
        }
        
        .border-box {
            width: 200px;
            padding: 20px;
            text-align: center;
            background-color: #f5f5f5;
        }
        
        .border-outset {
            border-style: outset;
            border-width: 5px;
            border-color: #ff5722;
        }
        
        .border-inset {
            border-style: inset;
            border-width: 5px;
            border-color: #4caf50;
        }
        
        .border-groove {
            border-style: groove;
            border-width: 5px;
            border-color: #2196f3;
        }
        
        .border-ridge {
            border-style: ridge;
            border-width: 5px;
            border-color: #9c27b0;
        }
        
        .note {
            background-color: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 10px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h2>Пример 8: Стили границ</h2>
    
    <div class="border-container">
        <div class="border-box border-outset">
            <strong>outset</strong><br>
            One-colored border!
        </div>
        <div class="border-box border-inset">
            <strong>inset</strong><br>
            Two-colored border!
        </div>
        <div class="border-box border-groove">
            <strong>groove</strong><br>
            Three-colored border!
        </div>
        <div class="border-box border-ridge">
            <strong>ridge</strong><br>
            Four-colored border!
        </div>
    </div>
    
    <div class="note">
        <strong>📝 ПРИМЕЧАНИЕ:</strong> Свойство "border-color" не работает отдельно. Вначале укажите стиль границы border-style.
    </div>
</body>
</html>
