<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Параграфы</title>
    <style>
        body {
            padding: 20px;
            font-family: Arial, sans-serif;
        }
        
        p {
            background-color: #e8eaf6;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
        }
        
        .custom-margin {
            margin-bottom: 30px;
            background-color: #c8e6c9;
        }
        
        .no-margin-top {
            margin-top: 0;
            background-color: #ffccbc;
        }
    </style>
</head>
<body>
    <h2>Пример 9: Параграфы</h2>
    
    <p>This is some text in a paragraph.</p>
    <p>This is some text in a paragraph.</p>
    <p>This is some text in a paragraph.</p>
    <p>This is some text</p>
    
    <hr>
    
    <h3>Параграфы с изменёнными отступами:</h3>
    <p class="custom-margin">Параграф с нижним отступом 30px</p>
    <p class="no-margin-top">Параграф без верхнего отступа (margin-top: 0)</p>
</body>
</html>
