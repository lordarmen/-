<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Высота и ширина блока</title>
    <style>
        body {
            padding: 20px;
        }
        
        .fixed-size {
            height: 100px;
            width: 500px;
            background-color: #ffe0b2;
            border: 2px solid #ff9800;
            margin: 20px 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .fixed-size p {
            margin: 0;
            text-align: center;
        }
    </style>
</head>
<body>
    <h2>Пример 7: Высота и ширина блока</h2>
    
    <div class="fixed-size">
        <p>У данного блока высота 100px, а ширина 500px</p>
    </div>
    
    <p>Обратите внимание: высота блока составляет 100 пикселей, ширина — 500 пикселей.</p>
</body>
</html>
