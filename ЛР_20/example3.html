<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Задание В - Кнопка и абзац</title>
</head>
<body>
    <h1>Задание В</h1>
    
    <p id="message">Этот текст изменится при клике на кнопку</p>
    <button id="myButton">Нажми меня!</button>
    
    <script>
        // Находим кнопку и абзац
        let button = document.querySelector('#myButton');
        let paragraph = document.querySelector('#message');
        
        // Добавляем обработчик события onclick
        button.onclick = function() {
            paragraph.textContent = 'Клик сработал!';
            paragraph.style.color = 'blue';
        };
    </script>
</body>
</html>
